[workspace]
members = ["cargo:."]

# How a release is built and published, by dist (https://opensource.axo.dev/cargo-dist/). After
# changing it, run `dist generate` to rewrite .github/workflows/release.yml. docs/releasing.md has
# the steps of a release.
[dist]
cargo-dist-version = "0.33.0"
ci = "github"
hosting = "github"
# macron drives launchd, so it is built for macOS only.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# No Homebrew formula for now: a tap is a public repository of its own. See docs/plan.md.
installers = ["shell"]
# ./publish-crates is .github/workflows/publish-crates.yml.
publish-jobs = ["./publish-crates"]
# The shell installer puts `macron` where `cargo install` would: a path that stays put across
# upgrades, which the jobs installed into launchd depend on.
install-path = "CARGO_HOME"
install-updater = false
