[workspace]
members = ["cargo:."]

# How a release is built and published, by dist (https://opensource.axo.dev/cargo-dist/). After
# changing it, run `dist generate` to rewrite .github/workflows/release.yml. docs/releasing.md has
# the steps of a release.
[dist]
cargo-dist-version = "0.33.0"
ci = "github"
hosting = "github"
# macron drives launchd, so it is built for macOS only.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
installers = ["shell", "homebrew"]
# The formula is `macron`, installed with `brew install realzai/tap/macron`.
tap = "realzai/homebrew-tap"
formula = "macron"
# The tap is updated with the HOMEBREW_TAP_TOKEN secret. ./publish-crates is
# .github/workflows/publish-crates.yml.
publish-jobs = ["homebrew", "./publish-crates"]
# The shell installer puts `macron` where `cargo install` would: a path that stays put across
# upgrades, which the jobs installed into launchd depend on.
install-path = "CARGO_HOME"
install-updater = false
